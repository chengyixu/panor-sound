    <noscript>
      <p class="noscript">
        Soundscape brings the world to your ears. We capture the sonic texture of cities — from the hum of a Hong Kong wet market to the quiet of a temple garden — and transform field recordings into immersive AI-powered soundscapes. Every location tells a story. Our library spans urban centers across Asia: Mong Kok footbridges at dusk, Victoria Park at dawn, Star Ferry terminals, and the narrow alleys of Shenzhen and Shanghai. Listen to curated Editor's Picks, explore the Sound Gallery on an interactive map, or browse community favorites. Discover featured soundscapes from Hong Kong, Shenzhen, Shanghai, and beyond. The Hall of Fame celebrates the researchers, field recordists, and engineers behind every track — including contributions from City University of Hong Kong and the MMHK Research Archive. Join sound walks through Mong Kok after dark, attend field recording workshops, or contribute your own recordings to our growing community library. Soundscape is built by a cross-disciplinary team who believe sound changes how we experience place. This site needs JavaScript to render its full interactive experience. For the best experience, enable JavaScript and visit us at panor.tech/sound.
      </p>
