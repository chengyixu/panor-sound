    <noscript>
      <p class="noscript">
        Soundscape is a live public archive of field recordings anchored in real places. The interactive version of this page requests the current public recording feed and ranking feed directly from the Soundscape service each time it loads. Titles, descriptions, creators, locations, coordinates, durations, play totals, audio files, featured rows, contributor summaries, and archive statistics are derived from those responses rather than copied into this website. Explicit test or demo records are excluded from the public presentation. JavaScript is required to request that live information, draw the geographic map, open recording details, and play audio in the fixed listening panel. If JavaScript is disabled, this fallback cannot truthfully reproduce a changing archive snapshot. Open the Soundscape application to browse the complete current collection, sign in or register through Panor unified auth, record a new field sound, and publish it with its real location. The Sound page is a read-only public discovery surface: it does not duplicate the Soundscape database, own authentication, store account credentials, or provide a second publishing workflow. Availability of recordings, rankings, audio, and map locations therefore follows the live Soundscape backend.
      </p>
    </noscript>
    <section class="live-player" id="live-player" aria-label="Compact Soundscape turntable" hidden>
      <div class="compact-turntable-stage">
        <button
          class="compact-vinyl-button"
          id="live-player-expand"
          type="button"
          aria-haspopup="dialog"
          aria-controls="turntable-dialog"
          aria-label="Open focused turntable"
        >
          <span class="vinyl-record" aria-hidden="true">
            <span class="vinyl-label"><span></span></span>
          </span>
        </button>
        <button class="tonearm-control tonearm-control-compact" id="live-player-tonearm" type="button">
          <span class="tonearm-pivot" aria-hidden="true"></span>
          <span class="tonearm-arm" aria-hidden="true"><span class="tonearm-head"></span></span>
        </button>
      </div>
      <div class="live-player-copy">
        <span class="live-player-source" id="live-player-source"></span>
        <strong id="live-player-title"></strong>
        <span id="live-player-location"></span>
        <span class="live-player-preview" id="live-player-compact-preview" aria-live="polite"></span>
      </div>
      <div class="live-player-actions">
        <button class="live-player-choose" id="live-player-choose" type="button">Choose recording</button>
        <button class="live-player-close" id="live-player-close" type="button" aria-label="Stop audio and close player">×</button>
      </div>
      <audio class="audio-player-deck" id="live-player-audio" preload="auto"></audio>
      <audio class="audio-player-deck" id="live-player-audio-standby" preload="auto"></audio>
    </section>

    <dialog class="turntable-dialog" id="turntable-dialog" aria-labelledby="focused-player-title">
      <div class="focused-turntable">
        <header class="focused-turntable-header">
          <button class="focused-player-collapse" id="focused-player-collapse" type="button">Back</button>
          <span class="focused-player-source" id="focused-player-source"></span>
          <a class="focused-player-app-link" id="live-player-app-link">Open in Soundscape</a>
        </header>
        <div class="focused-turntable-stage">
          <div class="vinyl-record vinyl-record-focused" aria-hidden="true">
            <span class="vinyl-label"><span></span></span>
          </div>
          <div class="turntable-candidates" id="turntable-candidates" aria-label="Recording choices" hidden></div>
          <button class="tonearm-control tonearm-control-focused" id="focused-player-tonearm" type="button">
            <span class="tonearm-pivot" aria-hidden="true"></span>
            <span class="tonearm-arm" aria-hidden="true"><span class="tonearm-head"></span></span>
          </button>
        </div>
        <div class="focused-player-copy">
          <span class="focused-player-state" id="focused-player-state"></span>
          <h2 id="focused-player-title"></h2>
          <p id="focused-player-location"></p>
          <p id="focused-player-description"></p>
          <button class="focused-player-choose" id="focused-player-choose" type="button">Choose recording</button>
        </div>
        <p class="sr-only" id="live-player-announcer" aria-live="polite"></p>
      </div>
    </dialog>
