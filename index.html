<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Configurable marketing-site scaffold." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sound</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" id="brand" href="./" aria-label="Home"></a>
      <nav aria-label="Primary navigation">
        <ul class="nav-list" id="primary-nav"></ul>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-heading">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-heading"></h1>
        <p class="hero-copy" id="hero-body"></p>
        <div class="cta-row" id="hero-actions"></div>
      </section>
      <div class="section-list" id="sections" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p id="footer-text"></p>
      <ul class="footer-links" id="footer-links"></ul>
    </footer>

    <noscript>
      <p class="noscript">This site needs JavaScript to render its configured content.</p>
    </noscript>
    <script src="./site.config.js"></script>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
