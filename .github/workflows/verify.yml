name: Verify static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''
      - run: node scripts/verify-site.mjs
      - run: node scripts/test-panor-registry.mjs
      - name: Verify production readiness for release changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git merge-base origin/main "$GITHUB_SHA")"
          fi
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(index\.html|site\.config\.js|assets/)'; then
            node scripts/verify-site.mjs --production
          else
            echo 'No deployable site files changed; production readiness gate skipped.'
          fi
