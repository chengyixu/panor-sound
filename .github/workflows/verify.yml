name: Verify static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm test

  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/repo-guards.sh

  production-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-site.mjs --production
      - run: node scripts/test-panor-registry.mjs

  ci-success:
    name: ci-success
    needs: [syntax-and-unit, browser-contract, guards, production-policy]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All blocking verification lanes passed.'

  verify:
    needs: ci-success
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Compatibility check for the existing protected branch rule.'
