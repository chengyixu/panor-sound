project: panor-sound
entries:
  - id: static-snapshot-passes-ci
    user_visible_symptom: The Sound page shows stale or invented recordings while CI remains green.
    lint: "site.config.js must not contain backend wire fields or known snapshot titles"
    chaos: null
    observable_signal: "Both /soundscape/api feeds appear in browser network traffic and rendered titles equal those responses."
    prevention: "Keep recording data backend-owned; enforce with source guards, contract tests, and production Playwright proof."
  - id: detached-leaflet-zero-markers
    user_visible_symptom: The map area loads but every marker has zero geometry and cannot be seen or selected.
    lint: "Leaflet initialization must run only after the map container is attached."
    chaos: null
    observable_signal: "test/e2e/live-page.e2e.test.mjs requires every .leaflet-interactive path to have a positive bounding box and a non-M0 0 path."
    prevention: "Render sections first, then initialize the map through the returned initializer."
  - id: backend-test-record-leaks-publicly
    user_visible_symptom: A public test or demo upload appears as a featured recording, top ranking, map marker, or archive statistic.
    lint: "NON_PRODUCTION_TITLE is the single domain filter for explicit test/demo/sample/placeholder/TBA title tokens."
    chaos: null
    observable_signal: "The domain regression test injects a 9,999-play KFC TEST row and proves it is absent from the complete model."
    prevention: "Filter once before every derived public surface; never patch individual UI sections."
  - id: play-telemetry-blocks-player-close
    user_visible_symptom: Closing the audio player stalls while anonymous play telemetry is pending.
    lint: null
    chaos: "The fixture browser test delays the play POST by 1.5 seconds."
    observable_signal: "The player must become hidden within 750 milliseconds while the telemetry request is still pending."
    prevention: "Start keepalive telemetry in the background, then synchronously pause and dismiss the player."
  - id: deploy-browser-proof-can-skip-without-rollback
    user_visible_symptom: A release can remain deployed when Chromium is unavailable, so live backend rendering was never proved.
    lint: "The deployment source guard requires Chromium installation before pre-deploy E2E and inside the rollback-covered browser step."
    chaos: null
    observable_signal: "The post-deploy browser step owns both browser installation and npm run test:production; any failure satisfies the rollback condition."
    prevention: "Keep all post-deploy browser prerequisites inside the step whose failure triggers atomic rollback."
  - id: production-proof-assumes-inline-stat-text
    user_visible_symptom: A correct live release is rolled back because the browser proof expects a statistic's number and label on one text line.
    lint: "The source guard requires production totals to be asserted through the stat card's strong and span elements."
    chaos: null
    observable_signal: "The production proof compares the rendered count and label separately, independent of layout whitespace."
    prevention: "Assert semantic DOM fields instead of flattened body text when layout elements intentionally create line breaks."
  - id: production-proof-races-map-tile
    user_visible_symptom: A correct live release is rolled back because map markers render before the first CARTO tile response is observed.
    lint: "The source guard requires the production proof to await the successful tile-response promise."
    chaos: null
    observable_signal: "The production proof waits up to 15 seconds for a CARTO HTTP 200 after the map is initialized."
    prevention: "Wait on the external response event instead of sampling a response array immediately after DOM readiness."
  - id: cloudflare-serves-stale-unversioned-assets
    user_visible_symptom: The HTML is current but Cloudflare serves an older site configuration, stylesheet, or JavaScript bundle for up to four hours, exposing stale placeholder content.
    lint: "The source guard requires every mutable browser asset and module import to carry the deployment release token."
    chaos: null
    observable_signal: "Packaging replaces the token with the merge SHA, and production smoke verifies the exact SHA on direct assets and nested module imports."
    prevention: "Keep HTML uncached and make every mutable asset URL unique per deployment; never rely on cache-request headers to invalidate an existing shared-cache HIT."
  - id: compact-vinyl-requires-double-activation
    user_visible_symptom: Tapping the compact vinyl once does nothing, especially on touch devices, because the player waits for a double-click or double-tap.
    lint: "The source contract forbids dblclick handlers and requires the compact vinyl to be a real button controlling the focused dialog."
    chaos: null
    observable_signal: "The turntable Playwright contract opens focused mode with one click and one mobile touchscreen tap."
    prevention: "Keep one semantic compact vinyl button as the only expansion gesture; never reintroduce double activation or a duplicate Expand control."
  - id: browse-state-never-ducks-audio
    user_visible_symptom: The tonearm enters Browse visually but the current recording remains at full volume, making previews feel abrupt and masking the selected transition.
    lint: null
    chaos: "The browser test holds a compact vertical tonearm drag beyond one detent and samples the active deck after the 150ms ramp."
    observable_signal: "Active-deck volume reaches approximately 0.25 before pointer release and returns to the normal transition path afterward."
    prevention: "Drive browse volume through the generation-cancelled 16ms ramp helper and pin the 150ms duck in Playwright."
  - id: crossfade-corrupts-active-deck
    user_visible_symptom: Metadata names one recording while another deck remains active, or both backend media sources continue playing after a rapid selection.
    lint: null
    chaos: "The browser contract inspects both decks during the crossfade and then requires exactly one populated active deck after completion."
    observable_signal: "Two live URLs overlap only during the transition; afterward one active deck matches the selected title and the outgoing deck has no source."
    prevention: "Promote the incoming deck when playback starts, generation-cancel stale transitions, and clear the outgoing deck only after handoff."
  - id: focused-dialog-leaves-scroll-locked
    user_visible_symptom: Collapsing the focused turntable returns to the page while background scrolling remains locked for an unpredictable interval.
    lint: null
    chaos: "The browser contract asserts body overflow immediately after Escape closes the modal rather than waiting for the dialog close event."
    observable_signal: "The focused dialog is closed, the compact player remains visible, and body overflow is no longer hidden in the same interaction turn."
    prevention: "Release the turntable-modal-open body class synchronously before calling dialog.close(); retain close-event cleanup only as an idempotent fallback."
  - id: independent-turntable-offsets-overlap-metadata
    user_visible_symptom: The focused tonearm or oversized record cuts through the recording title, description, or controls at common desktop and phone sizes.
    lint: null
    chaos: "The browser contract measures record, tonearm, and metadata rectangles at 1280×900 and 390×844."
    observable_signal: "Record-to-copy and tonearm-to-copy overlap areas remain exactly zero, with no horizontal document overflow."
    prevention: "Keep the focused player in one responsive stage-plus-metadata grid; never restore independent viewport offsets for its physical parts."
  - id: short-landscape-turntable-collapses-stage
    user_visible_symptom: On a short landscape screen, the turntable stage collapses into the metadata region, leaving a visually empty black slab below the title.
    lint: null
    chaos: "The fixture browser test opens the focused player at 782×472, matching a compact landscape viewport."
    observable_signal: "The focused player retains two grid columns, vertically centered metadata, and zero record or tonearm overlap with the metadata region."
    prevention: "Keep the short-landscape breakpoint as a two-column stage-and-copy grid; do not reuse the stacked mobile layout when height is constrained."
  - id: tonearm-cartridge-renders-detached
    user_visible_symptom: The cartridge head appears separated from the tonearm shaft while rotating, making the player look mechanically broken.
    lint: "The focused and compact markup must nest pivot → moving arm → arm → head → needle."
    chaos: null
    observable_signal: "The turntable browser contract proves the complete nested hierarchy exists before interaction."
    prevention: "Apply motion to the shared tonearm-moving ancestor instead of positioning the cartridge as a separate sibling."
  - id: curved-queue-crosses-tonearm
    user_visible_symptom: Recording labels or their invisible tap targets overlap the tonearm, especially on a 390×844 phone viewport.
    lint: null
    chaos: "The browser contract opens the five-item chooser at desktop and mobile sizes and measures every candidate rectangle."
    observable_signal: "Every candidate stays on the record, follows a concave left-offset pattern, remains inside the viewport, and has zero intersection with the tonearm hit area."
    prevention: "Reserve a fixed arm lane and bound the candidate width at each responsive breakpoint; do not use a full-width list beside the record."
  - id: parked-vinyl-keeps-spinning
    user_visible_symptom: Audio is paused with the needle parked, but the compact or focused vinyl still spins and communicates the wrong playback state.
    lint: null
    chaos: "The browser contract parks the tonearm after playback begins and reads the vinyl animation state."
    observable_signal: "The active audio deck is paused and the vinyl animation-play-state is paused at the same time."
    prevention: "Derive platter motion from the shared data-parked player state rather than from player visibility."
